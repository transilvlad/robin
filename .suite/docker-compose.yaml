# Docker Compose Suite for Robin MTA + Dovecot or Cyrus IMAP + PostgreSQL + Redis + ClamAV + Rspamd + Roundcube
# Demo-friendly baseline. Add docker-compose.production.yaml for production
# enforcement of real certificate material and reviewed image tags.
# This file sets up a complete end-to-end email infrastructure:
# - Robin MTA (SMTP server)
# - Mailbox backend (IMAP/LMTP), selected with MAILBOX_BACKEND in .env:
#   dovecot (default) or cyrus; see mailbox/

# - PostgreSQL (user database)
# - Redis (Rspamd statistics, history and module state)
# - ClamAV (virus scanning)
# - Rspamd (spam detection)
# - Roundcube (webmail)
# See .suite/init-suite.sh for initial directory setup on Windows WSL2.
# There is a Docker bug that sometimes may prevent mounting/creating non-existent directories.

# Robin Admin, the suite's web UI, pulled from its release on GitHub and run
# from the published images. Admin settings come from .suite/.env; database
# file secrets live in .suite/secrets/. See .env.example and init-secrets.sh.
# docker-compose.override.yaml points its mounts at this suite.
include:
  - path:
      - https://github.com/transilvlad/robin-admin.git#v${ROBIN_ADMIN_VERSION:-1.1.1}:docker-compose.yaml
      - https://github.com/transilvlad/robin-admin.git#v${ROBIN_ADMIN_VERSION:-1.1.1}:docker-compose.suite.yaml
    env_file: .env
  # Mailbox backend. Each file defines the IMAP/LMTP services and the
  # dependencies Robin and Roundcube need on them.
  - path: mailbox/${MAILBOX_BACKEND:-dovecot}.yaml

services:
  # PostgreSQL database for Robin, mailbox and Roundcube storage.
  suite-postgres:
    image: postgres:latest
    container_name: suite-postgres
    command:
      - "postgres"
      - "-c"
      - "logging_collector=on"
      - "-c"
      - "log_directory=/var/log"
      - "-c"
      - "log_filename=postgresql-%Y-%m-%d.log"
    environment:
      POSTGRES_DB: robin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DB_PASSWORD: ${DB_PASSWORD:?Set a unique Robin Admin database password}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:?Set a unique PostgreSQL monitoring password}
    secrets:
      - postgres_password
      - mta_db_password
      - mailbox_db_password
      - roundcube_db_password
    volumes:
      - ../log/postgres:/var/log
      - ../store/postgres:/var/lib/postgresql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    networks:
      suite:
        aliases:
          - postgres-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d robin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Rspamd. Its config file lives in the data volume so CONFIG REWRITE
  # persists. No port is published: it has no authentication.
  suite-redis:
    image: redis:alpine
    container_name: suite-redis
    command:
      - sh
      - -c
      - |
        if [ ! -f /data/redis.conf ]; then
          printf 'save 60 1\nloglevel warning\ndir /data\nprotected-mode no\n' > /data/redis.conf
        fi
        exec redis-server /data/redis.conf
    volumes:
      - redis-data:/data
    networks:
      suite:
        aliases:
          - redis-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ClamAV virus scanner.
  suite-clamav:
    image: clamav/clamav:latest
    platform: linux/amd64
    container_name: suite-clamav
    volumes:
      - ../log/clamav:/var/log/clamav
      - ../store/clamav:/var/lib/clamav
    networks:
      suite:
        aliases:
          - antivirus-backend
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s  # ClamAV needs time to download virus definitions.

  # Rspamd spam/phishing detection.
  suite-rspamd:
    image: rspamd/rspamd:latest
    container_name: suite-rspamd
    volumes:
      - ../log/rspamd:/var/log
      # Named volume: rspamd creates a Unix socket here, which macOS bind mounts can't host.
      - rspamd-data:/var/lib/rspamd
      - ./etc/rspamd/local.d:/etc/rspamd/local.d
    depends_on:
      suite-redis:
        condition: service_healthy
    networks:
      suite:
        aliases:
          - spam-backend
    healthcheck:
      test: ["CMD", "rspamadm", "configtest"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Seed the writable configuration cache once; PostgreSQL owns subsequent updates.
  suite-config-init:
    image: alpine:3.23
    command:
      - sh
      - -ec
      - |
        cp -n /templates/*.json5 /cfg/
        cp -n /templates/log4j2.xml /cfg/
    volumes:
      - ./cfg:/templates:ro
      - robin-config:/cfg
    network_mode: none

  # Robin MTA server.
  suite-robin:
    container_name: suite-robin
    build:
      context: ../
      dockerfile: ./Dockerfile
      args:
        INCLUDE_CFG: "false"
    volumes:
      - robin-config:/usr/local/robin/cfg
      - ./cfg/config.json5:/usr/local/robin/cfg/config.json5:ro
      - ./etc/demo-tls/robin-keystore.jks:/usr/local/robin/keystore.jks:ro
      - ../log/robin:/var/log/robin
      - ../store/robin:/usr/local/robin/store
    depends_on:
      suite-config-init:
        condition: service_completed_successfully
      suite-postgres:
        condition: service_healthy
      suite-clamav:
        condition: service_healthy
      suite-rspamd:
        condition: service_healthy
    ports:
      - "${MAIL_BIND:-0.0.0.0}:25:25"
      - "${MAIL_BIND:-0.0.0.0}:587:587"
      - "${MAIL_BIND:-0.0.0.0}:465:465"
    environment:
      - JAVA_TOOL_OPTIONS=-Dnetworkaddress.cache.negative.ttl=300 -Dsun.net.inetaddr.negative.ttl=300 ${JAVA_TOOL_OPTIONS:-}
      - MTA_DB_PASSWORD_FILE=/run/secrets/mta_db_password
      - MAILBOX_DB_PASSWORD_FILE=/run/secrets/mailbox_db_password
      - MAIL_HOSTNAME=${MAIL_HOSTNAME:-localhost}
      - CLAMAV_HOST=antivirus-backend
      - CLAMAV_PORT=3310
      - RSPAMD_HOST=spam-backend
      - RSPAMD_PORT=11333
      - DOVECOT_HOST=lmtp-backend
      - DOVECOT_LMTP_PORT=24
    secrets:
      - mta_db_password
      - mailbox_db_password
    networks:
      suite:
        aliases:
          - mta-backend
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "25"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Roundcube webmail for user access.
  suite-roundcube:
    image: roundcube/roundcubemail:latest
    container_name: suite-roundcube
    depends_on:
      suite-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEBMAIL_HTTP_PORT:-8888}:80"
    environment:
      - ROUNDCUBEMAIL_DB_TYPE=pgsql
      - ROUNDCUBEMAIL_DB_HOST=postgres-backend
      - ROUNDCUBEMAIL_DB_PORT=5432
      - ROUNDCUBEMAIL_DB_USER=robin_roundcube
      - ROUNDCUBEMAIL_DB_NAME=roundcube
      - ROUNDCUBEMAIL_DEFAULT_HOST=ssl://imap-backend
      - ROUNDCUBEMAIL_DEFAULT_PORT=993
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://mta-backend
      - ROUNDCUBEMAIL_SMTP_PORT=587
      - ROUNDCUBEMAIL_IMAP_CONN_OPTIONS={"ssl":{"verify_peer":false,"verify_peer_name":false}}
      - ROUNDCUBEMAIL_SMTP_CONN_OPTIONS={"ssl":{"verify_peer":false,"verify_peer_name":false}}
      - ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE=10M
    secrets:
      - roundcube_db_password
      - roundcube_des_key
    networks:
      suite:
        aliases:
          - webmail-backend
    volumes:
      - ../log/roundcube:/var/log

networks:
  suite:
    name: suite
    driver: bridge

volumes:
  rspamd-data:
    name: suite-rspamd-data
  redis-data:
    name: suite-redis-data
  robin-config: {}

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  mta_db_password:
    file: ./secrets/mta_db_password
  mailbox_db_password:
    file: ./secrets/mailbox_db_password
  roundcube_db_password:
    file: ./secrets/roundcube_db_password
  roundcube_des_key:
    file: ./secrets/roundcube_des_key
