# Sieve / Pigeonhole configuration (Dovecot 2.4 syntax)
# User sieve script - optional, won't fail if doesn't exist
sieve_script user {
  type = personal
  driver = file
  path = ~/sieve
  # Home is also the legacy Maildir root; dot-prefixed active scripts there
  # are mistaken for Maildir++ folders during quota enumeration.
  active_path = ~/sieve/.active.sieve
}
