# Namespace configuration.
namespace inbox {
  inbox = yes
  separator = /
  prefix =
  subscriptions = yes
  list = yes
}

# Grants are real mailbox ACLs, managed with IMAP SETACL or doveadm acl.
# The sharing index is state: include it in the mailbox backup.
namespace shared {
  type = shared
  separator = /
  prefix = Shared/$user/
  mail_driver = maildir
  mail_path = %{owner_home}
  mail_index_private_path = ~/shared-indexes/%{owner_user}
  subscriptions = no
  list = children
}
acl_driver = vfile
imap_acl_allow_anyone = no
acl_sharing_map {
  dict file {
    path = /var/mail/vhosts/shared-mailboxes.db
  }
}
