# Statistics metrics
#
# Define named metrics on Dovecot's event stream so the running stats service
# records auth / login / IMAP / delivery activity. `doveadm stats dump` (and a
# Dovecot OpenMetrics exporter, if enabled) then report these counters. This is
# stock Dovecot statistics configuration with no dependency on any external
# tooling. Event names follow Dovecot's documented stats events.

metric auth_success {
  filter = event=auth_request_finished AND success=yes
}

# On a failed auth the event still fires but the `success` field is not `yes`
# (it is unset), so match the negation rather than success=no.
metric auth_failure {
  filter = event=auth_request_finished AND NOT success=yes
}

metric login {
  filter = event=auth_request_finished AND success=yes
}

metric imap_command {
  filter = event=imap_command_finished
}

metric mail_delivery {
  filter = event=mail_delivery_finished
}
