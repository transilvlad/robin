enabled = true;
# Use the authenticated task policy, not optional PerformDkimSign request headers.
use_http_headers = false;
use_milter_headers = false;
sign_authenticated = true;
sign_local = false;
sign_inbound = false;
# Robin validates explicit sender grants before sending trusted User metadata.
allow_username_mismatch = true;
use_domain = "header";
selector = "default";
path = "/etc/rspamd/local.d/dkim/$domain.$selector.key";
