worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # No request URI, query strings, addresses or credentials in access logs.
    log_format safe '$status $request_method $body_bytes_sent $request_time';
    access_log /dev/stdout safe;
    limit_req_zone $binary_remote_addr zone=jmap_requests:1m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=jmap_connections:1m;
    map $http_origin $jmap_origin {
        default $http_origin;
        "" "https://$http_host";
    }
    include /etc/nginx/conf.d/*.conf;
}
