# Cyrus master process configuration for the Robin suite.

START {
  recover       cmd="ctl_cyrusdb -r"
}

SERVICES {
  imap          cmd="imapd" listen="0.0.0.0:143" prefork=1 maxchild=500
  sieve         cmd="timsieved" listen="0.0.0.0:4190" prefork=0 maxchild=50
  lmtp          cmd="lmtpd -a" listen="0.0.0.0:24" prefork=1 maxchild=50
}

EVENTS {
  checkpoint    cmd="ctl_cyrusdb -c" period=30
  delprune      cmd="cyr_expire -E 3" at=0400
  deleteprune   cmd="cyr_expire -E 4 -D 28" at=0430
  expungeprune  cmd="cyr_expire -E 4 -X 28" at=0445
  tlsprune      cmd="tls_prune" at=0400
}

DAEMON {
  idled         cmd="idled"
}
