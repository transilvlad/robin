# Cyrus IMAP configuration for the Robin suite.
# Users, aliases and passwords live in Robin's database. Robin delivers to
# canonical users over LMTP; the nginx IMAP proxy resolves alias logins.

configdirectory: /var/lib/cyrus/config
defaultpartition: default
partition-default: /var/lib/cyrus/mail
sievedir: /var/lib/cyrus/sieve
proc_path: /run/cyrus/proc
mboxname_lockpath: /run/cyrus/lock
hashimapspool: yes
umask: 077

# Mailbox naming: user@domain logins, "/" hierarchy separator, personal
# folders shown next to INBOX (same layout as the Dovecot backend).
virtdomains: userid
unixhierarchysep: yes
altnamespace: yes

# Global admin (credentials in sasldb, from the cyrus_admin_password secret).
admins: cyrus
allowanonymouslogin: no

# TLS terminates at the IMAP proxy; Cyrus is only reachable on the suite network.
allowplaintext: yes
sasl_mech_list: PLAIN LOGIN
sasl_pwcheck_method: auxprop saslauthd
sasl_auxprop_plugin: sasldb
sasl_sasldb_path: /etc/sasldb2
sasl_saslauthd_path: /run/saslauthd/mux
sasl_auto_transition: no

# Robin only delivers to existing users, so mailboxes are created on first
# delivery or login with a 20 GiB storage quota (in KiB).
lmtp_downcase_rcpt: yes
autocreate_post: yes
autocreate_quota: 20971520
autocreate_inbox_folders: Drafts | Sent | Trash | Junk
autocreate_subscribe_folders: Drafts | Sent | Trash | Junk
xlist-drafts: Drafts
xlist-sent: Sent
xlist-trash: Trash
xlist-junk: Junk

# Sieve scripts are managed over ManageSieve on port 4190.
sieve_maxscripts: 5

# Usage statistics in Prometheus format, written to {configdirectory}/stats/report.txt
# by promstatsd (cyrus.conf), read by the Robin Admin agent.
prometheus_enabled: yes
prometheus_update_freq: 30s
