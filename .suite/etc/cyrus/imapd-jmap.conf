
# Appended to the existing IMAP configuration, which is kept unchanged.
conversations: yes
conversations_db: twoskip
httpmodules: jmap
httpallowcompress: no
httpallowtrace: no
httpkeepalive: 20s
search_engine: xapian
search_index_headers: yes
search_queryscan: 0
defaultsearchtier: t1
t1searchpartition-default: /var/lib/cyrus/search
search_batchsize: 100
sync_log: yes
sync_log_channels: squatter
jmapsubmission_deleteonsend: no
# No shared SMTP credential or unrestricted relay. Webmail must use its explicit
# authenticated SMTP route until an original-author/From enforcing relay passes QA.
smtp_backend: sendmail
sendmail: /bin/false
