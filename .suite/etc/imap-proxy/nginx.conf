# nginx IMAP proxy for the Cyrus mailbox backend.
# Clients log in with their address, an alias or an auto alias. Robin's
# /mail/proxy-auth endpoint verifies the password, resolves the address to the
# canonical user and returns the Cyrus backend to connect to.
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

mail {
    server_name imap-backend;
    auth_http mta-backend:8090/mail/proxy-auth;
    auth_http_timeout 15s;
    proxy_pass_error_message on;
    proxy_timeout 30m;

    ssl_certificate /etc/nginx/certs/imap.crt;
    ssl_certificate_key /etc/nginx/certs/imap.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MAIL:10m;
    ssl_session_timeout 1h;

    imap_auth plain login;
    imap_capabilities IMAP4rev1 LITERAL+ ID ENABLE IDLE NAMESPACE UIDPLUS MOVE SPECIAL-USE QUOTA CONDSTORE;

    server {
        listen 993 ssl;
        protocol imap;
    }
}
