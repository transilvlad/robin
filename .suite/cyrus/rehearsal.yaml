# Standalone, unique-project rehearsal. No suite aliases or published ports.
# Starts only after upgrade.py completed all stages on a restored clone.
services:
  rehearsal-cyrus:
    image: ${CYRUS_JMAP_IMAGE:?Set the reviewed 3.12.4 image tag}
    init: true
    restart: "no"
    mem_limit: 768m
    cpus: 2
    environment:
      JMAP_SERVER_NAME: ${JMAP_SERVER_NAME:-jmap-rehearsal.test}
      ROBIN_AUTH_URL: http://mta-backend:8090/users/authenticate
    volumes:
      - data:/var/lib/cyrus
      - ${CYRUS_SNAPSHOT_DIR:?Set the absolute cold snapshot directory}/imapd.conf:/etc/imapd-base.conf:ro
      - ../etc/cyrus/imapd-jmap.conf:/etc/imapd-jmap.conf:ro
      - ../etc/cyrus/cyrus-jmap.conf:/etc/cyrus-jmap.conf:ro
    secrets:
      - cyrus_admin_password
    networks:
      - rehearsal
      - robin-auth
    healthcheck:
      test: ["CMD", "/usr/local/bin/suite-cyrus-jmap-healthcheck"]
      interval: 10s
      timeout: 25s
      retries: 5
      start_period: 60s
  rehearsal-proxy:
    image: ${JMAP_NGINX_IMAGE:?Set a reviewed nginx image}
    restart: "no"
    mem_limit: 64m
    cpus: 0.5
    environment:
      JMAP_SERVER_NAME: ${JMAP_SERVER_NAME:-jmap-rehearsal.test}
      JMAP_CYRUS_HOST: rehearsal-cyrus
      NGINX_ENVSUBST_FILTER: ^JMAP_(SERVER_NAME|CYRUS_HOST)
    volumes:
      - ../etc/jmap-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../etc/jmap-proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${JMAP_TLS_DIR:?Set the rehearsal TLS directory}/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ${JMAP_TLS_DIR:?Set the rehearsal TLS directory}/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    networks:
      rehearsal:
        aliases:
          - ${JMAP_SERVER_NAME:-jmap-rehearsal.test}
    depends_on:
      rehearsal-cyrus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8443"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  data:
    external: true
    name: ${CYRUS_REHEARSAL_VOLUME:?Set a labelled restored clone, never suite-cyrus-data}
networks:
  rehearsal:
    internal: true
  robin-auth:
    external: true
    name: ${CYRUS_AUTH_NETWORK:-suite}
secrets:
  cyrus_admin_password:
    file: ${CYRUS_ADMIN_SECRET_FILE:-../secrets/cyrus_admin_password}
