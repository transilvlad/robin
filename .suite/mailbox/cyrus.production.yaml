# Production settings for the Cyrus mailbox backend.
x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  suite-cyrus:
    <<: *runtime
    image: ${CYRUS_IMAGE:?Set CYRUS_IMAGE to a local release-specific build tag}
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 60s
    environment:
      - ROBIN_API_AUTH=${ROBIN_API_AUTH:?Set the shared Robin API credential}
  suite-imap-proxy:
    <<: *runtime
    image: ${NGINX_IMAGE:?Set NGINX_IMAGE to a reviewed nginx image}
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 1
    pids_limit: 64
    stop_grace_period: 60s
    environment:
      - ROBIN_API_AUTH=${ROBIN_API_AUTH:?Set the shared Robin API credential}
      - MAIL_TLS_PROFILE=production
    volumes:
      - ${MAIL_TLS_DIR:?Set MAIL_TLS_DIR to the operator certificate directory}:/run/mail-tls:ro
