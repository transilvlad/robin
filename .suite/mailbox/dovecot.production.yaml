# Production settings for the Dovecot mailbox backend.
x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  suite-dovecot:
    <<: *runtime
    image: ${DOVECOT_IMAGE:?Set DOVECOT_IMAGE to a reviewed Dovecot 2.4 image}
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 384
    stop_grace_period: 60s
    volumes:
      - ${MAIL_TLS_DIR:?Set MAIL_TLS_DIR to the operator certificate directory}:/run/mail-tls:ro
      - ../etc/dovecot/conf.d/99-production-tls.conf.example:/etc/dovecot/conf.d/99-production-tls.conf:ro
