# Dovecot configuration for migrating mailboxes out of the Dovecot backend.
# Loads the suite configuration and adds a master user, so imapsync can log in
# as each mailbox user without knowing their password.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap

!include /etc/dovecot/conf.d/*.conf

# Avoid memory-mapped index files, which some bind mounts do not support.
mmap_disable = yes

passdb migration-master {
  driver = passwd-file
  passwd_file_path = /run/migration/master-users
  master = yes
}
