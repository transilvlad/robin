# Explicit production overlay, also used by examples/docker-compose/compose.yaml.
# Supply reviewed image tags/digests in .suite/.env. Do not pull mutable tags
# during an upgrade without reviewing the resulting image-lock diff.
x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

include:
  - path: mailbox/${MAILBOX_BACKEND:-dovecot}.production.yaml

services:
  suite-postgres:
    <<: *runtime
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to a reviewed PostgreSQL 18 image}
    entrypoint: ["sh", "/etc/postgresql/suite-start.sh"]
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_directory=/var/log
      - -c
      - log_filename=postgresql.log
      - -c
      - log_rotation_age=0
      - -c
      - log_rotation_size=0
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 256
    shm_size: 128m
    stop_grace_period: 120s
    volumes:
      - ./postgres-entrypoint.sh:/etc/postgresql/suite-start.sh:ro
      - ./db-init-production/01-create-users.sql:/docker-entrypoint-initdb.d/01-create-users.sql:ro
      - ./migration/001-mail-domains-and-sender-grants.sql:/docker-entrypoint-initdb.d/03-mail-domains-and-sender-grants.sql:ro
  suite-redis:
    <<: *runtime
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE to a reviewed Redis image}
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 128
    stop_grace_period: 60s
    command: ["sh", "/etc/redis/suite-start.sh"]
    volumes:
      - ./etc/redis/start.sh:/etc/redis/suite-start.sh:ro
      - ./etc/redis/production.conf:/etc/redis/suite-production.conf:ro
    secrets:
      - source: redis_auth
        target: redis_auth.conf
      - source: redis_acl
        target: redis_auth.acl
      - redis_password
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli --raw ping | grep -qx PONG'
      interval: 10s
      timeout: 5s
      retries: 5
  suite-clamav:
    <<: *runtime
    image: ${CLAMAV_IMAGE:?Set CLAMAV_IMAGE to a reviewed ClamAV image}
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 60s
    environment:
      FRESHCLAM_CHECKS: "24"
      CLAMAV_MAX_SIGNATURE_AGE_SECONDS: "172800"
      CLAMD_CONF_StreamMaxLength: "20M"
      CLAMD_CONF_MaxFileSize: "50M"
      CLAMD_CONF_MaxScanSize: "100M"
      CLAMD_CONF_MaxRecursion: "16"
      CLAMD_CONF_MaxFiles: "1000"
      CLAMD_CONF_MaxThreads: "4"
      CLAMD_CONF_MaxQueue: "16"
      CLAMD_CONF_MaxConnectionQueueLength: "16"
      CLAMD_CONF_MaxScanTime: "20000"
      CLAMD_CONF_ReadTimeout: "15"
      CLAMD_CONF_CommandReadTimeout: "5"
      CLAMD_CONF_SendBufTimeout: "500"
      CLAMD_CONF_HeuristicAlerts: "yes"
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncrypted: "yes"
      CLAMD_CONF_ConcurrentDatabaseReload: "yes"
      CLAMD_CONF_LogRotate: "yes"
      CLAMD_CONF_LogFileMaxSize: "10M"
      FRESHCLAM_CONF_LogRotate: "yes"
      FRESHCLAM_CONF_LogFileMaxSize: "10M"
    volumes:
      - ./etc/clamav/healthcheck.sh:/usr/local/bin/suite-clamav-healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/suite-clamav-healthcheck.sh"]
  suite-rspamd:
    <<: *runtime
    image: ${RSPAMD_IMAGE:?Set RSPAMD_IMAGE to a reviewed Rspamd image}
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 60s
    volumes:
      - ./etc/rspamd/production/local.d:/etc/rspamd/local.d
    secrets:
      - source: rspamd_controller
        target: rspamd_controller.inc
      - source: rspamd_redis
        target: rspamd_redis.inc
  suite-roundcube:
    <<: *runtime
    image: ${ROUNDCUBE_IMAGE:?Set ROUNDCUBE_IMAGE to a reviewed Roundcube image}
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 128
    stop_grace_period: 60s
    environment:
      - MAIL_HOSTNAME=${MAIL_HOSTNAME:?Set MAIL_HOSTNAME to your public mail hostname}
    volumes:
      - ./etc/roundcube/production.php:/var/roundcube/config/production.php:ro
  suite-config-init:
    volumes:
      - ./cfg-production/server.json5:/templates/server.json5:ro
      - ./cfg-production/bots.json5:/templates/bots.json5:ro
      - ./cfg-production/rspamd.json5:/templates/rspamd.json5:ro
      - ./cfg-production/queue.json5:/templates/queue.json5:ro
  suite-robin:
    <<: *runtime
    image: ${ROBIN_IMAGE:?Set ROBIN_IMAGE to a local release-specific build tag}
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 2
    pids_limit: 256
    stop_grace_period: 60s
    volumes: !override
      - robin-config:/usr/local/robin/cfg
      - ./cfg/config.json5:/usr/local/robin/cfg/config.json5:ro
      - ${MAIL_TLS_DIR:?Set MAIL_TLS_DIR to the operator certificate directory}:/run/robin-tls:ro
      - ../log/robin:/var/log/robin
      - ../store/robin:/usr/local/robin/store
    environment:
      - MAIL_HOSTNAME=${MAIL_HOSTNAME:?Set MAIL_HOSTNAME to your public mail hostname}
      - ROBIN_API_AUTH=${ROBIN_API_AUTH:?Set the unique API credential for trusted suite clients}
  suite-admin:
    environment:
      - ROBIN_API_AUTH=${ROBIN_API_AUTH:?Set the unique API credential for trusted suite clients}
      - REDIS_ADMIN_DSN=${REDIS_ADMIN_DSN:?Set an authenticated Redis DSN matching secrets/redis_password}
    volumes:
      - ./etc/rspamd/production/local.d:/mnt/rspamd/local.d
