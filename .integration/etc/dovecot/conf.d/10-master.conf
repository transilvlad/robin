# Define all service identities explicitly because the Dovecot image's minimal
# account database does not provide the upstream `dovecot` group.
service auth {
  user = root
  group = root
  unix_listener auth-userdb {
    mode = 0666
    user = root
    group = root
  }
  unix_listener auth-master {
    mode = 0666
    user = root
    group = root
  }
  client_limit = 7000
  process_limit = 1
  vsz_limit = 1 G
}

service imap-login {
  user = nobody
  group = nogroup
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  process_limit = 10
  client_limit = 500
  vsz_limit = 256M
}

service imap {
  process_limit = 1024
  user = root
  group = root
  extra_groups = root
}

service imap-hibernate {
  user = root
  group = root
  unix_listener imap-hibernate {
    user = root
    group = root
  }
}

service imap-urlauth-worker {
  user = root
  group = root
  extra_groups = root
  unix_listener imap-urlauth-worker {
    user = root
    group = root
  }
}

service pop3-login {
  user = nobody
  group = nogroup
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
  process_limit = 5
  client_limit = 300
  vsz_limit = 128M
}

service pop3 {
  process_limit = 512
  user = root
  group = root
  extra_groups = root
}

service managesieve-login {
  user = nobody
  group = nogroup
  inet_listener sieve {
    port = 4190
  }
  process_limit = 2
  client_limit = 50
  vsz_limit = 128M
}

service managesieve {
  process_limit = 50
  user = root
  group = root
  extra_groups = root
}

service lmtp {
  user = root
  group = root
  extra_groups = root
  unix_listener lmtp {
    mode = 0666
    user = root
    group = root
  }
  inet_listener lmtp {
    port = 24
  }
  process_limit = 200
  process_min_avail = 20
  client_limit = 1
  vsz_limit = 512M
}

service dict {
  user = root
  group = root
  unix_listener dict {
    mode = 0660
    user = root
    group = root
  }
}

service dict-async {
  user = root
  group = root
  unix_listener dict-async {
    mode = 0660
    user = root
    group = root
  }
}

service doveadm {
  user = root
  group = root
  extra_groups = root
}

service indexer {
  user = root
  group = root
  extra_groups = root
}

service indexer-worker {
  user = root
  group = root
  extra_groups = root
}

service stats {
  user = root
  group = root
  unix_listener stats-writer {
    mode = 0660
    user = root
    group = root
  }
}
